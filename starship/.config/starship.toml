# ~/.config/starship.toml — managed by ~/dotfiles (stow package: starship)
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$nodejs\
$golang\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"

[python]
format = '[${symbol}${version}( \($virtualenv\))]($style) '
symbol = "py "

[nodejs]
format = "[$symbol$version]($style) "
symbol = "node "

[golang]
format = "[$symbol$version]($style) "
symbol = "go "

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
